<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="إدارة المال — تطبيق شخصي لإدارة الراتب والمصروفات اليومية والمصاريف الشهرية والصناديق، يعمل بالكامل داخل المتصفح.">
  <meta name="theme-color" content="#0B3B2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="إدارة المال">
  <title>إدارة المال</title>

  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <link rel="manifest" href="manifest.json">

  <!-- الخط اختياري: إذا لم يتوفر الإنترنت يُستخدم خط النظام تلقائيًا -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="style.css">
  <script>
    // تطبيق الوضع (فاتح/داكن) قبل الرسم لتجنب الوميض
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('mm_settings') || '{}');
        var t = s.theme || 'auto';
        if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
</head>
<body>
  <!-- ================= SVG ICON SPRITE ================= -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
      <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M5 3h14v18l-2.5-1.8L14 21l-2-1.8L10 21l-2.5-1.8L5 21z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 2.5v3M16 2.5v3M3 9.5h18"/><path d="m9 15 2 2 4-4"/></symbol>
      <symbol id="i-vault" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="2.5"/><circle cx="12" cy="11.5" r="3.5"/><path d="M12 8v-.5M12 15.5v-.5M7 19v2M17 19v2"/></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/><path d="M12 8S10.5 3.5 8 4.5 9 8 12 8zM12 8s1.5-4.5 4-3.5S15 8 12 8z"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 2.5v3M16 2.5v3M3 9.5h18M7.5 13.5h.01M12 13.5h.01M16.5 13.5h.01M7.5 17h.01M12 17h.01"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7.5 16v2M11.5 11v7M15.5 13v5M19.5 7v11"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-in" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-out" viewBox="0 0 24 24"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></symbol>
      <symbol id="i-transfer" viewBox="0 0 24 24"><path d="M4 8h15l-4-4M20 16H5l4 4"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2h.01"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3.5"/><path d="M3 7.5V18a2 2 0 0 0 2 2h15V9H5.5A2.5 2.5 0 0 1 3 7.5z"/><circle cx="16" cy="14.5" r="1.2"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v6c0 4.6 3.2 7.7 7.5 9 4.3-1.3 7.5-4.4 7.5-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
      <symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v4.5c0 1.7 2.7 3 6 3s6-1.3 6-3V7"/><path d="M9 14.5v2c0 1.7 2.7 3 6 3s6-1.3 6-3V12c0-1.7-2.7-3-6-3"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5l1.5-3h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.5 2 1.5 3 3 3-1-3-.5-6 0-8.5z"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <!-- ================= SIDEBAR (Desktop) ================= -->
    <aside class="sidebar" aria-label="القائمة الجانبية">
      <a class="brand" href="#dashboard" aria-label="إدارة المال — الرئيسية">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="currentColor"/>
          <path d="M8.5 22.5h15" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/>
          <path d="M10.5 19v-3.5M16 19v-7M21.5 19V9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <span class="brand-text">
          <strong>إدارة المال</strong>
          <small>ميزانيتك الشخصية</small>
        </span>
      </a>

      <button type="button" class="btn btn-primary btn-block btn-add-side" data-action="add-expense">
        <svg class="icon"><use href="#i-plus"/></svg>
        إضافة مصروف
      </button>

      <nav class="side-nav" id="sideNav" aria-label="التنقل الرئيسي"></nav>

      <div class="sidebar-foot">
        <button type="button" class="side-theme" data-action="toggle-theme" aria-label="تبديل الوضع الفاتح والداكن">
          <svg class="icon icon-sun"><use href="#i-sun"/></svg>
          <svg class="icon icon-moon"><use href="#i-moon"/></svg>
          <span class="theme-label">الوضع الداكن</span>
        </button>
        <p class="privacy-note">
          <svg class="icon"><use href="#i-lock"/></svg>
          بياناتك محفوظة على هذا الجهاز فقط
        </p>
      </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <div class="main">
      <header class="topbar">
        <a class="brand brand-mobile" href="#dashboard" aria-label="إدارة المال">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="9" fill="currentColor"/>
            <path d="M8.5 22.5h15" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/>
            <path d="M10.5 19v-3.5M16 19v-7M21.5 19V9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
        </a>
        <div class="topbar-titles">
          <h1 id="pageTitle">الرئيسية</h1>
          <p id="pageSubtitle" class="page-subtitle"></p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn topbar-theme" data-action="toggle-theme" aria-label="تبديل الوضع">
            <svg class="icon icon-sun"><use href="#i-sun"/></svg>
            <svg class="icon icon-moon"><use href="#i-moon"/></svg>
          </button>
          <button type="button" class="btn btn-primary topbar-add" data-action="add-expense">
            <svg class="icon"><use href="#i-plus"/></svg>
            إضافة مصروف
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <!-- ================= BOTTOM NAV (Mobile) ================= -->
  <nav class="bottom-nav" aria-label="التنقل السفلي">
    <a href="#dashboard" data-route="dashboard" class="bn-item">
      <svg class="icon"><use href="#i-home"/></svg><span>الرئيسية</span>
    </a>
    <a href="#expenses" data-route="expenses" class="bn-item">
      <svg class="icon"><use href="#i-receipt"/></svg><span>المصروفات</span>
    </a>
    <button type="button" class="bn-fab" data-action="add-expense" aria-label="إضافة مصروف">
      <span class="bn-fab-circle"><svg class="icon"><use href="#i-plus"/></svg></span>
      <span class="bn-fab-label">إضافة مصروف</span>
    </button>
    <a href="#funds" data-route="funds" class="bn-item">
      <svg class="icon"><use href="#i-vault"/></svg><span>الصناديق</span>
    </a>
    <button type="button" class="bn-item" data-action="open-more" data-route-group="more">
      <svg class="icon"><use href="#i-more"/></svg><span>المزيد</span>
    </button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">يحتاج تطبيق "إدارة المال" إلى تفعيل JavaScript في المتصفح.</div>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
